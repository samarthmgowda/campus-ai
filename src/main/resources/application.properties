spring.application.name=campus-ai
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update

ollama.base-url=http://localhost:11434
ollama.embedding-model=bge-m3
# Read timeout for an embed call, in ms. Shorter than the chat timeout on purpose:
# an embed is one forward pass over a short chunk, so anything not answered in 30s
# is hung rather than slow, and embedding runs inside retrieval — a hung embed
# parks a request thread indefinitely.
ollama.embed-timeout-ms=30000
# Swap this to A/B a larger model (e.g. qwen2.5:7b-instruct) — no recompile needed.
# Re-run POST /eval/rag/run before and after and compare the summary.
ollama.chat-model=qwen2.5:3b

# Generation parameters for /api/chat. num-ctx is the important one: Ollama's
# default window is small for many local models and an over-long prompt is
# truncated SILENTLY (no error) — and the numbered passages a RAG answer cites
# sit at the end of the prompt, so the lost tail is exactly the evidence the
# answer depends on. Budgeted in AskService via ContextBudget.
ollama.num-ctx=4096
# Max tokens to generate. -1 = until the model stops (Ollama default).
# A positive cap bounds worst-case latency on local CPU.
ollama.num-predict=-1
ollama.temperature=0.2
ollama.top-p=0.9
ollama.repeat-penalty=1.1

rag.min-similarity=0.45
# Passages handed to the model. 3 is tight for multi-fact questions; raise to 5
# and re-run the eval to see whether recall improves without hurting correctness.
rag.top-k=3
# Retrieve-wide (pool) then deterministic rerank (lexical + semantic fusion).
# Set false to compare basic fusion order vs reranked order before keeping the stage.
rag.rerank-enabled=true
rag.rerank-pool=10
# Deterministic groundedness post-check: min fraction of answer terms that must
# appear in retrieved context (with citation + verbatim-number checks always on).
rag.faithfulness-min-overlap=0.15

# Rerank fusion weights (sum to 1.0). Defaults are the tuned values; change one
# at a time and re-run the eval — the harness verdicts on win/tie/loss, so an
# unmeasured weight change is a guess.
rag.rerank.w-semantic=0.45
rag.rerank.w-terms=0.25
rag.rerank.w-bigram=0.15
rag.rerank.w-phrase=0.10
rag.rerank.w-title=0.05
# Hybrid retrieval branch weights for reciprocal-rank fusion.
rag.fusion.semantic-weight=0.5
rag.fusion.keyword-weight=0.5

# Weighted teammate recommendation (research track): S = w-skill*SkillMatch
# + w-interest*ProjectInterest + w-availability*Availability
# + w-complementary*ComplementarySkills. Semantic arm blends with bge-m3 cosine.
teammate.w-skill=0.50
teammate.w-interest=0.20
teammate.w-availability=0.20
teammate.w-complementary=0.10
teammate.semantic-blend=0.30

# Admin actions are gated on the JWT principal's ROLE_ADMIN (see AuthContext /
# AdminBootstrap), not on a client-supplied id list. The old campus.admin-ids
# allow-list has been retired.

# HMAC signing key for JWTs. NO default is committed on purpose: a guessable
# secret in version control lets anyone forge an admin token against a running
# instance. Supply it via the JWT_SECRET environment variable (>= 32 chars).
# Local development does not need to set this — run with the `dev` profile
# (application-dev.properties carries a throwaway value):
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
# Outside `dev`, SecretsGuard refuses to start when this is blank, too short,
# or a known placeholder.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# Bootstrap admin account, provisioned at startup (idempotent). Leave the email
# blank to skip provisioning entirely (then no admin exists until sign-up is
# enabled or the row is created another way). Supply credentials via env vars.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.full-name=${APP_ADMIN_FULL_NAME:Campus Admin}
