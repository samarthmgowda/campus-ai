spring.application.name=campus-ai
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update

ollama.base-url=http://localhost:11434
ollama.embedding-model=bge-m3
ollama.chat-model=qwen2.5:3b
rag.min-similarity=0.45
rag.top-k=3
# Retrieve-wide (pool) then deterministic rerank (lexical + semantic fusion).
# Set false to compare basic fusion order vs reranked order before keeping the stage.
rag.rerank-enabled=true
rag.rerank-pool=10
# Deterministic groundedness post-check: min fraction of answer terms that must
# appear in retrieved context (with citation + verbatim-number checks always on).
rag.faithfulness-min-overlap=0.15

# Weighted teammate recommendation (research track): S = w-skill*SkillMatch
# + w-interest*ProjectInterest + w-availability*Availability
# + w-complementary*ComplementarySkills. Semantic arm blends with bge-m3 cosine.
teammate.w-skill=0.50
teammate.w-interest=0.20
teammate.w-availability=0.20
teammate.w-complementary=0.10
teammate.semantic-blend=0.30

# Admin allow-list for moderation actions (comma-separated demo user ids)
campus.admin-ids=1
