# Local-development profile — THROWAWAY secrets, safe to commit.
#
# These values exist only so a fresh clone can boot without ceremony. They are
# deliberately NOT used anywhere else: the base application.properties carries no
# secret at all, and SecretsGuard refuses to start outside the `dev` profile when
# a real secret is missing. Never deploy with this profile active.
#
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# The signing key below is >= 32 bytes (HS256 minimum) but is public and must be
# treated as compromised — it is only ever valid for a local, non-exposed run.
jwt.secret=dev-only-insecure-signing-key-change-me-32b

# Seed admin for local development. Password is intentionally trivial; it only
# ever guards a locally-run instance bound to localhost.
app.admin.email=admin@campus.edu
app.admin.password=admin123
app.admin.full-name=Campus Admin
